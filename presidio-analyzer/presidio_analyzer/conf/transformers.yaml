nlp_engine_name: transformers
models:
  - lang_code: lt
    model_name:
      spacy: lt_core_news_sm
      transformers: VytautoDidziojoUniversitetas/NUS-LT-PII-xlm-roberta-large

ner_model_configuration:
  labels_to_ignore:
  - O
  aggregation_strategy: max # "simple", "first", "average", "max"
  stride: 16                # If stride >= 0, process long texts in
                            # overlapping windows of the model max
                            # length. The value is the length of the
                            # window overlap in transformer tokenizer
                            # tokens, NOT the length of the stride.
  alignment_mode: contract # "strict", "contract", "expand"
  model_to_presidio_entity_mapping:
    PER: PERSON
    LOC: LOCATION
    ORG: ORGANIZATION
    ID_PER: ID
    ID_MISC: ID
    NUM_PHONE: PHONE_NUMBER
    AGE: AGE
    DATE: DATE_TIME
    TIME: DATE_TIME
    DURATION: DATE_TIME
    HEALTH: MEDICAL_CONDITION

  labels_to_ignore:
    - O
    - VALUE
    - MISC
    - ID_MISC
    - NAT
    - REL
    - POL
    - ETH
    - FAM
    - AGE
    - HEALTH
    - MAR
    - OCC
    - NUM_CAR
    - DURATION
    - NRP
  
  model_to_presidio_entity_mapping:
    PER: PERSON
    LOC: LOCATION
    ORG: ORGANIZATION
    ID_PER: ID
    NUM_PHONE: PHONE_NUMBER
    DATE: DATE_TIME
    TIME: DATE_TIME

  default_score: 0.6
